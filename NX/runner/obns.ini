; OBNS 1.32: the runner's configuration (mono-nx's format), at sdmc:/switch/OBNS/managed/obns.ini.
[mono]
; The assemblies' metadata, beside this file. Paths without a device: the runner works from sdmc:/switch/OBNS.
assembly_dir = /switch/OBNS/managed
config_dir = /switch/OBNS/managed
default_assembly = /switch/OBNS/managed/OpenBve.NX.dll
; mono-nx's start-up needs ICU's data (read by the runner, so a device path is fine). .NET itself runs invariant; leaving
; ICU out (30 MB) is for the memory step.
icu = sdmc:/switch/OBNS/managed/icudt77l.dat

[nx]
; mono-nx can't start twice in one process: end it (hbmenu too) so the next start is clean.
exit_process_on_end = true
; Title takeover only: applet mode's 386 MiB is too little for OBNS.
force_full_application = true
