[mono]
icu = romfs:/icudt77l.dat
assembly_dir = /
config_dir = /
default_assembly = /hello.dll

[nx]
; mono-nx can't start a second time in one process: end the process, hbmenu with it, so the next start is clean.
exit_process_on_end = true
; Title takeover only: applet mode's 386 MiB is too little for OBNS.
force_full_application = true
